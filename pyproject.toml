[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "optical-flow"
version = "0.1.0"
description = "Lucas-Kanade optical flow, epipole, depth, and planar-flow estimation"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "matplotlib",
    "numpy",
    "opencv-python",
    "scipy",
    "seaborn",
    "tqdm",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]
raft = ["torch>=2", "torchvision>=0.15"]

[project.scripts]
optical-flow = "optical_flow.cli:main"
optical-flow-improved = "optical_flow.improved_cli:main"
optical-flow-benchmark = "optical_flow.benchmark:main"

[tool.setuptools.packages.find]
where = ["src"]
